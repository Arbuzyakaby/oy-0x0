  <style>
    :root {
      --bg: #0A0A0B; --fg: #F2F2F0; --muted: #A3A3A8; --line: rgba(255, 255, 255, .1);
      --accent: #B3202A; --accent-text: #FF6B73; --ok: #4ADE9B;
      --sans: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); }
    body {
      font-family: var(--sans); -webkit-font-smoothing: antialiased;
      min-height: 100vh; min-height: 100svh;
      display: grid; grid-template-rows: 1fr auto;
      background: radial-gradient(60% 50% at 50% 38%, rgba(179, 32, 42, .22), transparent 70%), var(--bg);
    }
    main {
      display: grid; place-items: center; text-align: center;
      padding: 48px 16px;
    }
    .mark { width: min(340px, 78vw); height: auto; overflow: visible; }
    .mark circle {
      fill: none; stroke: var(--accent-text); stroke-width: 2.2;
      transform-box: fill-box; transform-origin: center;
      animation: blink 4.8s ease-in-out infinite 1.2s;
    }
    .mark path { stroke: var(--fg); stroke-width: 2.2; stroke-linecap: round; }
    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(1); }
      92% { transform: scaleY(.06); }
    }
    .code { margin: 28px 0 0; font-family: var(--mono); font-size: 14px; letter-spacing: .12em; color: var(--muted); }
    h1 { margin: 10px 0 0; font-size: clamp(34px, 7vw, 64px); font-weight: 800; letter-spacing: -.035em; line-height: 1.02; }
    p.lead { margin: 18px auto 0; max-width: 34ch; font-size: clamp(16px, 2.2vw, 19px); line-height: 1.5; color: var(--muted); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      margin-top: 32px; height: 52px; padding: 0 28px; border-radius: 999px;
      background: var(--accent); color: #fff; font: 600 16px/1 var(--sans); text-decoration: none;
      transition: transform .2s;
    }
    .btn:hover { transform: translateY(-1px); }
    a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    footer {
      border-top: 1px solid var(--line);
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
      display: flex; justify-content: center; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 600; text-align: center;
    }
    footer svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--ok); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
    @media (prefers-reduced-motion: reduce) { .mark circle { animation: none; } .btn { transition: none; } }
  </style>
</head>

      <a class="btn" href="/">На главную</a>
    </div>
  </main>

    Этот сайт не использует cookies и трекеры. Проверьте сами.
  </footer>
